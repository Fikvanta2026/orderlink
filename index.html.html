    function formatINR(n) {
      return '₹' + (Number(n) || 0).toLocaleString('en-IN');
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatRelTime(iso) {
      const diffMin = Math.floor((Date.now() - new Date(iso || Date.now()).getTime()) / 60000);
      if (diffMin < 1) return 'Just now';
      if (diffMin < 60) return `${diffMin}m ago`;
      const h = Math.floor(diffMin / 60);
      if (h < 24) return `${h}h ago`;
      return `${Math.floor(h / 24)}d ago`;
    }

    function getTrialDaysLeft() {
      const m = state.merchant;
      if (!m || !m.trial_ends_at) return 0;
      const diff = new Date(m.trial_ends_at).getTime() - Date.now();
      return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
    }

    function getShareableStoreUrl() {
      const base = window.location.origin !== 'null' && window.location.origin.startsWith('http')
        ? `${window.location.origin}${window.location.pathname}`
        : 'https://orderlink.app/';
      const slug = (state.merchant && state.merchant.slug) || 'aanya-gifts';
      return `${base}?shop=${encodeURIComponent(slug)}`;
    }

    function showToast(message, variant = 'navy') {
      const container = document.getElementById('toast-container');
      const colors = {
        navy: 'bg-[#0F172A] text-white border-slate-700',
        emerald: 'bg-emerald-600 text-white border-emerald-500',
        amber: 'bg-amber-500 text-white border-amber-400',
        red: 'bg-rose-600 text-white border-rose-500',
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg border text-xs font-bold flex items-center justify-between gap-2 animate-fade-in ${colors[variant] || colors.navy}`;
      el.innerHTML = `<span class="leading-snug">${escapeHTML(message)}</span><button class="opacity-75 hover:opacity-100 ml-2" onclick="this.parentElement.remove()">✕</button>`;
      container.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 220); }, 3200);
    }

    function compressImageFile(file, maxSize = 720, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read file.'));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error('Invalid image file.'));
          img.onload = () => {
            let { width, height } = img;
            if (width > maxSize || height > maxSize) {
              if (width > height) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              } else {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            canvas.toBlob(
              (blob) => resolve({ blob, dataUrl }),
              'image/jpeg',
              quality
            );
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function loadMerchantBundleFromSupabase(merchantId, userEmail = '') {
      if (!sb) return { ok: false, error: 'Supabase SDK not initialized.' };
      try {
        const mRes = await sb.from('merchants').select('*').eq('id', merchantId).maybeSingle();

        if (mRes.error) {
          state.ui.authError = mRes.error.message || 'Failed to load merchant profile.';
          showToast(state.ui.authError, 'red');
          return { ok: false, error: state.ui.authError };
        }

        let merchantRow = mRes.data;

        if (!merchantRow) {
          const prefix = (userEmail ? userEmail.split('@')[0] : 'My Shop')
            .replace(/[^a-zA-Z0-9]+/g, ' ')
            .trim()
            .replace(/\b\w/g, (c) => c.toUpperCase()) || 'My Shop';
          const baseSlug = prefix.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'shop';
          const autoProfile = {
            id: merchantId,
            shop_name: prefix,
            slug: `${baseSlug}-${Math.floor(100 + Math.random() * 899)}`,
            owner_name: 'Owner',
            whatsapp_number: '919876543210',
            city: 'India',
            category: 'General Store',
          };

          const insRes = await sb.from('merchants').insert(autoProfile).select().maybeSingle();
          if (insRes.error) {
            state.ui.authError = insRes.error.message || 'Could not auto-create merchant profile.';
            showToast(state.ui.authError, 'red');
            return { ok: false, error: state.ui.authError };
          }
          merchantRow = insRes.data || autoProfile;
          showToast('Profile auto-created! Update your shop details in Settings.', 'emerald');
        }

        const [pRes, oRes, cRes, sRes] = await Promise.all([
          sb.from('products').select('*').eq('merchant_id', merchantId).order('created_at', { ascending: false }),
          sb.from('orders').select('*').eq('merchant_id', merchantId).order('created_at', { ascending: false }),
          sb.from('coupons').select('*').eq('merchant_id', merchantId).order('created_at', { ascending: false }),
          sb.from('offer_slides').select('*').eq('merchant_id', merchantId).order('created_at', { ascending: false }),
        ]);

        state.isCloudLive = true;
        state.ui.authError = null;
        state.merchant = merchantRow;
        state.products = pRes.data || [];
        state.orders = oRes.data || [];
        state.coupons = cRes.data || [];
        state.offer_slides = sRes.data || [];

        const activeTheme = getMerchantTheme(merchantRow.id, merchantRow.category);
        state.ui.selectedTheme = activeTheme;
        applyTheme(activeTheme);
        return { ok: true };
      } catch (err) {
        const msg = (err && err.message) || 'Network error loading Supabase data.';
        state.ui.authError = msg;
        showToast(msg, 'red');
        return { ok: false, error: msg };
      }
    }

    function exportOrdersCSV() {

        o.order_code, new Date(o.created_at).toLocaleDateString('en-IN'),

        o.subtotal, o.discount || 0, o.delivery_fee || 0, o.total, o.payment_status, o.order_status,

      const csv = [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${state.merchant.slug || 'orderlink'}-orders.csv`; a.click();
      URL.revokeObjectURL(url);

    async function handleProductImageFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('pm-upload-status');
      const urlInput = document.getElementById('pm-img-url');
      const previewEl = document.getElementById('pm-img-preview');
      const saveBtn = document.getElementById('pm-save-btn');

      if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Processing photo...'; }
      if (statusEl) { statusEl.className = 'text-[10px] font-bold text-amber-600'; statusEl.textContent = 'Compressing & uploading photo...'; }

      try {
        const { blob, dataUrl } = await compressImageFile(file, 720, 0.78);

        // Immediately show preview & set compressed dataUrl as guaranteed fallback
        if (previewEl) previewEl.src = dataUrl;
        if (urlInput) urlInput.value = dataUrl;

        // Attempt upload to Supabase Storage bucket 'shop-assets'
        if (state.isCloudLive && sb && blob) {
          const path = `${state.merchant.id}/${Date.now()}.jpg`;
          const { error } = await sb.storage.from('shop-assets').upload(path, blob, {
            contentType: 'image/jpeg',
            upsert: true,
          });
          if (!error) {
            const { data } = sb.storage.from('shop-assets').getPublicUrl(path);
            if (data && data.publicUrl) {
              if (urlInput) urlInput.value = data.publicUrl;
              if (previewEl) previewEl.src = data.publicUrl;
              if (statusEl) { statusEl.className = 'text-[10px] font-bold text-emerald-600'; statusEl.textContent = '✓ Photo uploaded to cloud storage!'; }
              return;
            }
          } else {
            console.warn('Storage bucket upload fallback:', error.message);
          }
        }

        if (statusEl) {
          statusEl.className = 'text-[10px] font-bold text-emerald-600';
          statusEl.textContent = '✓ Photo ready! Tap Save / Update Item.';
        }
      } catch (err) {
        if (statusEl) { statusEl.className = 'text-[10px] font-bold text-rose-600'; statusEl.textContent = '❌ Could not load image: ' + err.message; }
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = document.querySelector('#modal-root h3')?.textContent.includes('Edit') ? 'Update Item' : 'Save & Publish';
        }
      }
    }

    function handleBulkCSV(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        const lines = e.target.result.split(/\r?\n/).filter((l) => l.trim());
        const batch = [];
        for (let i = 1; i < lines.length; i++) {
          const [name, category, priceStr, mrpStr, description] = lines[i].split(',').map((c) => c.trim().replace(/^"|"$/g, ''));
          const price = Number(priceStr);
          if (name && price > 0) {
            batch.push({
              merchant_id: state.merchant.id,
              name, category: category || 'General', description: description || '',
              price, mrp: Number(mrpStr) || null, image_url: FALLBACK_IMG,
              dietary: 'veg', in_stock: true, is_bestseller: false,
              variants: [{ label: 'Standard', price, mrp: Number(mrpStr) || null }],
            });
          }
        }
        if (batch.length) {
          if (state.isCloudLive && sb) {
            const { data, error } = await sb.from('products').insert(batch).select();
            if (!error && data) state.products = [...data, ...state.products];
          } else {
            batch.forEach((b, idx) => state.products.unshift({ id: 'csv-' + Date.now() + idx, ...b }));
            saveLocalDemo();
          }
          showToast(`Imported ${batch.length} products!`, 'emerald');
        }
        closeModal();
        renderApp();
      };
      reader.readAsText(file);
    }

    function stopAutoSlide() {

    }

    function startAutoSlide() {
      stopAutoSlide();
      const active = state.offer_slides.filter((s) => s.is_active);
      if (state.ui.mode !== 'store' || active.length <= 1) return;
      slideTimer = setInterval(() => {
        const track = document.getElementById('offer-track');
        if (!track) return;
        const next = (state.ui.activeSlideIndex + 1) % active.length;
        state.ui.activeSlideIndex = next;
        track.scrollTo({ left: next * track.clientWidth, behavior: 'smooth' });
      }, 3800);
    }

    function updateCartQty(prodId, varIdx, delta) {
      const m = state.merchant;
      if (!m.is_open || m.plan_status === 'expired' || m.plan_status === 'paused') {
        showToast('Ordering is currently paused by this store.', 'amber');
        return;
      }
      const key = `${prodId}__${varIdx}`;
      const next = (state.cart[key] || 0) + delta;
      if (next <= 0) delete state.cart[key];
      else state.cart[key] = next;
      renderApp();
    }

    function getCartSummary() {
      let count = 0;
      let subtotal = 0;
      const items = [];
      for (const [key, qty] of Object.entries(state.cart)) {
        if (qty <= 0) continue;
        const [prodId, varIdxStr] = key.split('__');
        const varIdx = Number(varIdxStr) || 0;
        const p = state.products.find((x) => x.id === prodId && x.in_stock);
        if (!p) continue;
        const vars = Array.isArray(p.variants) && p.variants.length ? p.variants : [{ label: 'Standard', price: p.price }];
        const v = vars[varIdx] || vars[0];
        count += qty;
        subtotal += Number(v.price) * qty;
        items.push({ product_id: p.id, name: p.name, variant: v.label, qty, price: Number(v.price) });
      }

      let discount = 0;
      let couponCode = '';
      if (state.appliedCoupon && subtotal >= (Number(state.appliedCoupon.min_order) || 0)) {
        couponCode = state.appliedCoupon.code;
        discount = state.appliedCoupon.discount_type === 'percent'
          ? Math.round((subtotal * Number(state.appliedCoupon.discount_value)) / 100)
          : Math.min(subtotal, Number(state.appliedCoupon.discount_value));
      }

      const threshold = Number(state.merchant.free_delivery_above) || 500;
      const fee = subtotal === 0 || subtotal >= threshold ? 0 : (Number(state.merchant.delivery_fee) || 0);
      const total = Math.max(0, subtotal - discount + fee);
      return { count, subtotal, discount, couponCode, deliveryFee: fee, total, threshold, items };
    }

    function applyCoupon() {
      const code = (document.getElementById('co-coupon')?.value || '').trim().toUpperCase();
      const found = state.coupons.find((c) => c.code.toUpperCase() === code && c.is_active);
      if (!found) { showToast('Invalid coupon code.', 'red'); return; }
      const { subtotal } = getCartSummary();
      if (subtotal < (Number(found.min_order) || 0)) {
        showToast(`Minimum order ${formatINR(found.min_order)} required.`, 'amber');
        return;
      }
      state.appliedCoupon = found;
      showToast(`Coupon ${found.code} applied!`, 'emerald');
      openCheckoutModal();
    }

    function openCheckoutModal() {
      const c = getCartSummary();
      if (c.count === 0) return;
      const cp = state.customerProfile;
      const defAddr = (cp.addresses && cp.addresses.find((a) => a.isDefault)) || (cp.addresses && cp.addresses[0]);
      const upiUri = `upi://pay?pa=${encodeURIComponent(state.merchant.upi_id || 'shop@upi')}&pn=${encodeURIComponent(state.merchant.shop_name)}&am=${c.total}&cu=INR`;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&margin=6&data=${encodeURIComponent(upiUri)}`;

      const root = document.getElementById('modal-root');

    async function submitWhatsAppOrder(e) {
      e.preventDefault();
      const customer_name = document.getElementById('co-name').value.trim();
      const customer_phone = document.getElementById('co-phone').value.replace(/\D/g, '');
      const customer_address = document.getElementById('co-addr').value.trim();
      const delivery_slot = document.getElementById('co-slot').value;
      const c = getCartSummary();
      if (!customer_name || !customer_phone || !c.items.length) return;

      const order_code = `#ORD-${Math.floor(1000 + Math.random() * 8999)}`;
      const payload = {
        order_code,
        merchant_id: state.merchant.id,
        customer_name,
        customer_phone,
        customer_address,
        delivery_slot,
        items: c.items,
        subtotal: c.subtotal,
        discount: c.discount,
        coupon_code: c.couponCode || null,
        delivery_fee: c.deliveryFee,
        total: c.total,
        payment_status: 'Pending',
        order_status: 'Pending',
      };

      if (state.isCloudLive && sb) {
        const { data, error } = await sb.from('orders').insert(payload).select().maybeSingle();
        if (!error && data) state.orders.unshift(data);
        else if (error) showToast('Saved locally (cloud sync warning): ' + error.message, 'amber');
      } else {
        state.orders.unshift({ id: 'ord-' + Date.now(), ...payload, created_at: new Date().toISOString() });
        saveLocalDemo();
      }

      state.cart = {};
      state.appliedCoupon = null;
      closeModal();
      renderApp();

      const lines = c.items.map((i) => `• ${i.qty}x ${i.name} (${i.variant}) — ${formatINR(i.price * i.qty)}`).join('\n');
      const msg =
        `🛍️ *New Order — ${state.merchant.shop_name}*\nOrder ID: *${order_code}*\n\n${lines}\n\n` +
        (c.discount > 0 ? `🎟️ Coupon (${c.couponCode}): -${formatINR(c.discount)}\n` : '') +
        `🚚 Delivery: ${c.deliveryFee > 0 ? formatINR(c.deliveryFee) : 'FREE'}\n` +
        `💰 *Total:* ${formatINR(c.total)}\n\n` +
        `👤 ${customer_name} (${customer_phone})\n📍 ${customer_address}\n⏰ ${delivery_slot}`;

      const wa = (state.merchant.whatsapp_number || '').replace(/\D/g, '');
      window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener,noreferrer');
      showToast(`Order ${order_code} placed!`, 'emerald');
    }

    async function toggleWishlist(prodId) {
      const list = state.customerProfile.wishlist || [];
      const idx = list.indexOf(prodId);
      if (idx === -1) { list.push(prodId); showToast('Added to Wishlist ❤️', 'emerald'); }
      else { list.splice(idx, 1); showToast('Removed from Wishlist', 'navy'); }
      state.customerProfile.wishlist = list;
      await syncCustomerProfile();
      renderApp();
    }

    async function syncCustomerProfile() {
      const cp = state.customerProfile;
      if (state.isCloudLive && sb && cp.isLoggedIn && cp.phone) {
        await sb.from('customer_profiles').upsert({
          phone: cp.phone,
          name: cp.name,
          addresses: cp.addresses || [],
          wishlist: cp.wishlist || [],
          updated_at: new Date().toISOString(),
        });
      } else {
        saveLocalDemo();
      }
    }

    async function handleCustomerLogin(e) {
      e.preventDefault();
      const name = document.getElementById('cp-name').value.trim();
      const phone = document.getElementById('cp-phone').value.replace(/\D/g, '');
      if (!name || phone.length < 10) { showToast('Enter valid name & 10-digit mobile.', 'amber'); return; }

      state.customerProfile.isLoggedIn = true;
      state.customerProfile.name = name;
      state.customerProfile.phone = phone;

      if (state.isCloudLive && sb) {
        try {
          const { data } = await sb.from('customer_profiles').select('*').eq('phone', phone).maybeSingle();
          if (data) {
            state.customerProfile.name = data.name || name;
            state.customerProfile.addresses = Array.isArray(data.addresses) ? data.addresses : [];
            state.customerProfile.wishlist = Array.isArray(data.wishlist) ? data.wishlist : [];
          } else {
            await syncCustomerProfile();
          }
          const { data: myOrds } = await sb.from('orders').select('*').eq('customer_phone', phone).order('created_at', { ascending: false });
          state.customerOrders = myOrds || [];
        } catch (err) {}
      } else {
        saveLocalDemo();
      }
      showToast(`Welcome, ${state.customerProfile.name}!`, 'emerald');
      openCustomerProfileModal('orders');
      renderApp();
    }

    async function addCustomerAddress(e) {
      e.preventDefault();
      const label = document.getElementById('ca-label').value;
      const text = document.getElementById('ca-text').value.trim();
      if (!text) return;
      state.customerProfile.addresses.forEach((a) => { a.isDefault = false; });
      state.customerProfile.addresses.unshift({ id: 'a-' + Date.now(), label, text, isDefault: true });
      await syncCustomerProfile();
      showToast('Address saved!', 'emerald');
      openCustomerProfileModal('addresses');
    }

    async function deleteCustomerAddress(id) {
      state.customerProfile.addresses = state.customerProfile.addresses.filter((a) => a.id !== id);
      await syncCustomerProfile();
      openCustomerProfileModal('addresses');
    }

    function reorderOrder(orderId) {
      const list = state.isCloudLive ? state.customerOrders : state.orders;
      const o = list.find((x) => x.id === orderId);
      if (!o) return;
      (o.items || []).forEach((it) => {
        const p = state.products.find((x) => x.id === it.product_id && x.in_stock);
        if (!p) return;
        const vars = Array.isArray(p.variants) && p.variants.length ? p.variants : [{ label: 'Standard', price: p.price }];
        let vIdx = vars.findIndex((v) => v.label === it.variant);
        if (vIdx < 0) vIdx = 0;
        const key = `${p.id}__${vIdx}`;
        state.cart[key] = (state.cart[key] || 0) + (it.qty || 1);
      });
      closeModal();
      showToast(`Items from ${o.order_code} added to cart!`, 'emerald');
      renderApp();
    }

    function openStoreQRModal() {
      const url = getShareableStoreUrl();
      const qr = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=10&data=${encodeURIComponent(url)}`;
      const root = document.getElementById('modal-root');
      root.classList.remove('hidden');
      root.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
          <div class="bg-white rounded-3xl w-full max-w-xs p-6 text-center space-y-3 animate-fade-in">
            <h3 class="text-base font-extrabold">${escapeHTML(state.merchant.shop_name)}</h3>
            <img src="${qr}" alt="Store QR" class="w-48 h-48 mx-auto rounded-2xl border border-slate-200 p-2" />
            <button onclick="closeModal()" class="w-full py-2.5 bg-[#0F172A] text-white font-bold text-xs rounded-xl">Close</button>
          </div>
        </div>
      `;
    }

    function renderCustomerStorefront() {
      const m = state.merchant;
      const biz = getBusinessConfig(m.category);
      const ctaOrderLabel = biz.isService ? 'Book on WhatsApp' : t('orderOnWa');
      const addBtnLabel = biz.isService ? '+ Book' : '+ Add';
      const isLocked = !m.is_open || m.plan_status === 'expired' || m.plan_status === 'paused';
      const cats = ['All', ...new Set(state.products.filter((p) => p.in_stock).map((p) => p.category || 'General'))];
      const products = state.products.filter((p) => p.in_stock && (state.ui.storeCategory === 'All' || p.category === state.ui.storeCategory));
      const slides = state.offer_slides.filter((s) => s.is_active);
      const cart = getCartSummary();
      const rem = Math.max(0, cart.threshold - cart.subtotal);
      const pct = Math.min(100, Math.round((cart.subtotal / (cart.threshold || 1)) * 100));

      return `
        <div class="min-h-screen bg-[#F8FAFC] ${cart.count > 0 ? 'pb-36' : 'pb-12'}">
          <div class="bg-theme-primary text-white px-4 py-2 flex items-center justify-between text-[11px]">
            <span class="font-semibold text-white/80">🛍️ ${escapeHTML(m.category || 'Storefront')} • ${state.isCloudLive ? 'Live' : 'Demo'}</span>
            <button onclick="setMode('merchant')" class="text-amber-400 font-bold">&larr; Dashboard</button>
          </div>

          ${isLocked ? `<div class="bg-rose-600 text-white px-4 py-2.5 text-center text-xs font-bold">⛔ ${t('storePaused')}</div>` : ''}

          <header class="bg-white border-b border-slate-100 p-4 flex items-center justify-between gap-2">
            <div class="flex items-center gap-3 min-w-0">
              <img src="${escapeHTML(m.logo_url)}" onerror="this.src='${FALLBACK_IMG}'" class="w-12 h-12 rounded-2xl object-cover border border-slate-100 shrink-0" />
              <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                  <h1 class="text-base font-extrabold truncate">${escapeHTML(m.shop_name)}</h1>
                  <span class="px-1.5 py-0.5 bg-emerald-100 text-emerald-700 text-[9px] font-bold rounded-full">✓</span>
                </div>
                <p class="text-[11px] text-slate-500">📍 ${escapeHTML(m.city || 'India')} • Free delivery &gt; ${formatINR(m.free_delivery_above || 500)}</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button onclick="openCustomerProfileModal('wishlist')" class="w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center text-sm">❤️</button>
              <button onclick="openCustomerProfileModal('orders')" class="px-2.5 h-9 rounded-xl bg-brand-primary text-white text-[11px] font-bold">
                👤 ${state.customerProfile.isLoggedIn ? escapeHTML(state.customerProfile.name.split(' ')[0]) : 'Profile'}
              </button>
            </div>
          </header>

          ${slides.length ? `
            <section class="pt-3 pb-1">
              <div id="offer-track" class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar scroll-smooth">
                ${slides.map((s) => {
                  const th = OFFER_THEMES[s.theme] || OFFER_THEMES.navy;
                  return `
                    <div class="w-full shrink-0 snap-center px-4">
                      <div class="rounded-2xl bg-gradient-to-br ${th.bg} p-4 text-white shadow-md flex items-center justify-between gap-3 min-h-[120px]">
                        <div class="flex-1 min-w-0 space-y-1">
                          <span class="inline-block px-2 py-0.5 rounded-full text-[9px] font-extrabold ${th.badge}">${escapeHTML(s.badge)}</span>
                          <h2 class="text-base font-extrabold leading-tight">${escapeHTML(s.title)}</h2>
                          <p class="text-[11px] text-white/85 line-clamp-2">${escapeHTML(s.subtitle)}</p>
                        </div>
                        ${s.image_url ? `<img src="${escapeHTML(s.image_url)}" class="w-18 h-18 rounded-xl object-cover shrink-0 ring-2 ring-white/20" />` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
          ` : ''}

          <nav class="px-4 py-3 flex gap-2 overflow-x-auto no-scrollbar sticky top-0 bg-[#F8FAFC]/95 z-20">
            ${cats.map((c) => `<button onclick="state.ui.storeCategory='${escapeHTML(c)}'; renderApp();" class="px-3.5 py-1.5 rounded-full text-xs font-bold shrink-0 ${state.ui.storeCategory === c ? 'bg-theme-primary text-white' : 'bg-white border border-slate-200 text-slate-700'}">${escapeHTML(c)}</button>`).join('')}
          </nav>

          <main class="px-4 space-y-3">
            ${products.map((p) => {
              const vars = Array.isArray(p.variants) && p.variants.length ? p.variants : [{ label: 'Standard', price: p.price, mrp: p.mrp }];
              const vIdx = state.selectedVariants[p.id] || 0;
              const v = vars[vIdx] || vars[0];
              const qty = state.cart[`${p.id}__${vIdx}`] || 0;
              const wished = (state.customerProfile.wishlist || []).includes(p.id);
              return `
                <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-xs flex gap-3 items-start">
                  <div class="relative shrink-0">
                    <img src="${escapeHTML(p.image_url)}" onerror="this.src='${FALLBACK_IMG}'" class="w-24 h-24 rounded-xl object-cover" />
                    <button onclick="toggleWishlist('${p.id}')" class="absolute top-1.5 right-1.5 w-7 h-7 rounded-full bg-white/90 shadow-xs flex items-center justify-center text-xs">${wished ? '❤️' : '🤍'}</button>
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1.5">
                      ${biz.isFood && p.dietary === 'veg' ? '<span class="w-3 h-3 border border-emerald-600 p-0.5 inline-flex items-center justify-center rounded-[2px]"><span class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span></span>' : ''}
                      ${p.is_bestseller ? '<span class="px-1.5 py-0.5 bg-amber-100 text-amber-800 text-[9px] font-bold rounded">★ Best Seller</span>' : ''}
                    </div>
                    <h3 class="font-bold text-sm truncate mt-0.5">${escapeHTML(p.name)}</h3>
                    <p class="text-[11px] text-slate-500 line-clamp-1">${escapeHTML(p.description)}</p>
                    ${vars.length > 1 ? `
                      <div class="flex flex-wrap gap-1 mt-1.5">
                        ${vars.map((vr, idx) => `<button onclick="state.selectedVariants['${p.id}']=${idx}; renderApp();" class="px-2 py-0.5 rounded-lg text-[10px] font-bold border ${idx === vIdx ? 'bg-theme-primary text-white border-theme-primary' : 'bg-slate-50 text-slate-600 border-slate-200'}">${escapeHTML(vr.label)}</button>`).join('')}
                      </div>
                    ` : ''}
                    <div class="flex items-center justify-between mt-2">
                      <div class="flex items-baseline gap-1.5">
                        <span class="font-extrabold text-sm">${formatINR(v.price)}</span>
                        ${v.mrp ? `<span class="text-xs text-slate-400 line-through">${formatINR(v.mrp)}</span>` : ''}
                      </div>
                      ${qty > 0
                        ? `<div class="flex items-center bg-theme-primary text-white rounded-xl px-2 py-1 gap-2.5 text-xs font-bold"><button onclick="updateCartQty('${p.id}', ${vIdx}, -1)" class="px-1">−</button><span>${qty}</span><button onclick="updateCartQty('${p.id}', ${vIdx}, 1)" class="px-1">+</button></div>`
                        : `<button ${isLocked ? 'disabled' : ''} onclick="updateCartQty('${p.id}', ${vIdx}, 1)" class="px-3.5 py-1.5 ${isLocked ? 'bg-slate-100 text-slate-400' : 'bg-theme-soft text-theme-primary'} rounded-xl text-xs font-bold">${addBtnLabel}</button>`
                      }
                    </div>
                  </div>
                </div>
              `;
            }).join('') || `<p class="text-center py-10 text-xs text-slate-400">No items available right now.</p>`}
          </main>

          ${m.plan_status !== 'active' ? `
            <footer class="mt-8 text-center pb-4">
              <span class="inline-flex items-center gap-1 px-3 py-1 bg-white border border-slate-200 rounded-full text-[11px] font-bold text-slate-500">⚡ Powered by <strong class="text-slate-900">OrderLink</strong></span>
            </footer>
          ` : ''}

          ${cart.count > 0 && !isLocked ? `
            <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 shadow-2xl z-30 animate-slide-up">
              <div class="px-4 py-1.5 bg-slate-50 border-b border-slate-100">
                <div class="flex justify-between text-[10px] font-bold mb-1">
                  <span class="${rem === 0 ? 'text-emerald-600' : 'text-slate-600'}">${rem === 0 ? t('freeDeliveryUnlocked') : `Add ${formatINR(rem)} more for FREE Delivery`}</span>
                  <span>${pct}%</span>
                </div>
                <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden"><div class="h-full ${rem === 0 ? 'bg-emerald-500' : 'bg-amber-500'} transition-all" style="width:${pct}%"></div></div>
              </div>
              <div class="p-3.5 flex items-center justify-between">
                <div><p class="text-[11px] text-slate-500 font-semibold">${cart.count} ${t('itemsSelected')}</p><p class="text-lg font-extrabold leading-tight">${formatINR(cart.total)}</p></div>
                <button onclick="openCheckoutModal()" class="px-5 py-3 bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold text-sm rounded-2xl shadow-md">${ctaOrderLabel}</button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderSuperAdmin() {
      return `
        <div class="min-h-screen bg-[#F8FAFC] pb-12">
          <header class="bg-[#0F172A] text-white px-4 py-3.5 flex items-center justify-between sticky top-0 z-30">
            <div>
              <span class="text-[10px] font-extrabold uppercase text-amber-400">SaaS Console</span>
              <h1 class="text-base font-extrabold">OrderLink Super Admin</h1>
            </div>
            <button onclick="setMode('auth')" class="px-3 py-1.5 bg-white/10 rounded-xl text-xs font-bold">Exit</button>
          </header>
          <main class="p-4 space-y-3">
            <div class="flex items-center justify-between">${renderCloudPill()}<span class="text-xs font-bold text-slate-500">${state.adminMerchants.length} Shop(s)</span></div>
            ${state.adminMerchants.map((shop) => `
              <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-xs space-y-2.5">
                <div class="flex justify-between items-start">
                  <div>
                    <h4 class="font-extrabold text-sm">${escapeHTML(shop.shop_name)}</h4>
                    <p class="text-[11px] text-slate-500">${escapeHTML(shop.owner_name || '')} • ${escapeHTML(shop.city || '')} • ?shop=${escapeHTML(shop.slug)}</p>
                  </div>
                  <span class="px-2 py-0.5 text-[10px] font-extrabold rounded-full ${shop.plan_status === 'active' ? 'bg-emerald-100 text-emerald-700' : shop.plan_status === 'trial' ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-700'}">${escapeHTML((shop.plan_status || 'trial').toUpperCase())}</span>
                </div>
                <div class="grid grid-cols-4 gap-1.5">
                  <button onclick="updateMerchantPlan('${shop.id}', 'active', 30)" class="py-1.5 bg-emerald-600 text-white text-[10px] font-bold rounded-lg">+30d Pro</button>
                  <button onclick="updateMerchantPlan('${shop.id}', 'trial', 0)" class="py-1.5 bg-amber-100 text-amber-900 text-[10px] font-bold rounded-lg">Trial</button>
                  <button onclick="updateMerchantPlan('${shop.id}', 'paused', 0)" class="py-1.5 bg-slate-200 text-slate-800 text-[10px] font-bold rounded-lg">Pause</button>
                  <button onclick="updateMerchantPlan('${shop.id}', 'expired', 0)" class="py-1.5 bg-rose-50 text-rose-700 text-[10px] font-bold rounded-lg">Expire</button>
                </div>
              </div>
            `).join('')}
          </main>
        </div>
      `;
    }

    function renderApp() {
      stopAutoSlide();
      const app = document.getElementById('app');
      if (state.ui.mode === 'auth') app.innerHTML = renderAuthScreen();
      else if (state.ui.mode === 'admin') app.innerHTML = renderSuperAdmin();
      else if (state.ui.mode === 'store') { app.innerHTML = renderCustomerStorefront(); startAutoSlide(); }
      else {
        app.innerHTML = renderMerchantDashboard();
        if ((state.merchant.plan_status === 'expired' || state.merchant.plan_status === 'paused') && document.getElementById('modal-root').classList.contains('hidden')) {
          openUpgradeModal();
        }
      }
    }

    /**
     * ============================================================================
     * 9. BOOTSTRAP (CHECK ?shop=<slug> OR EXISTING SUPABASE SESSION)
     * ============================================================================
     */
    window.addEventListener('DOMContentLoaded', async () => {
      applyTheme(getActiveThemeId());
      const params = new URLSearchParams(window.location.search);
      const shopSlug = params.get('shop');

      if (shopSlug) {
        const loaded = await loadStorefrontBySlug(shopSlug);
        if (!loaded) showToast(`Showing demo storefront for "${shopSlug}".`, 'amber');
        state.ui.mode = 'store';
        renderApp();
        return;
      }

      if (sb) {
        try {
          const { data } = await sb.auth.getSession();
          if (data && data.session && data.session.user) {
            const res = await loadMerchantBundleFromSupabase(data.session.user.id, data.session.user.email || '');
            if (res.ok) {
              state.ui.mode = 'merchant';
              renderApp();
              return;
            }
          }
        } catch (e) {}
      }

      renderApp();
    });
  </script>
</body>
</html>
